name: site
on:
  push:
    paths:
      - "site/**"
      - "loom.json"
      - "loom.lock"
      - ".forgejo/workflows/site.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 http://forgejo:3000/rh/emb-loom.git repo
      - run: cd repo && node site/build.mjs
      - run: cd repo && node --test site/build.test.mjs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 http://forgejo:3000/rh/emb-loom.git repo
      - run: cd repo && node site/build.mjs
      - run: cd repo && node --test site/build.test.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "80857f4ead88b4e7dbddc1176d8f3350"
          npm_config_registry: "https://registry.npmmirror.com"
        run: cd repo/site && npx --yes wrangler deploy
