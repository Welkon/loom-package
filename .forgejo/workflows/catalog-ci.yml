name: catalog-ci
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 http://forgejo:3000/rh/emb-loom.git repo
      - run: make -C repo test
      - run: node repo/tools/loom/check-catalog.mjs repo
      - run: node repo/tools/loom/lock.mjs repo --check
      - run: node --test repo/site/build.test.mjs
