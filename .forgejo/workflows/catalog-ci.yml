name: catalog-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make test
      - run: node tools/loom/check-catalog.mjs
      - run: node --test site/build.test.mjs
